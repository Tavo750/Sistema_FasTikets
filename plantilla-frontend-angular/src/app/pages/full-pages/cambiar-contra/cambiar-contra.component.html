<header class="header">
  <div class="logo">
    <img src="img/logo/logo-fasticket.jpg" alt="FASTICKET">
  </div>
  <div class="header-buttons">
    <button class="btn-header" (click)="router.navigate(['/crear_usuario'])">Registrarse</button>
    <!-- Botón con icono de casita -->
    <button class="btn-icon" title="Ir a Página Principal">
      <img src="img/logo/home.jpg" alt="Inicio">
    </button>
  </div>
</header>
<div class="login-container">
  <!-- Lado izquierdo con la imagen -->
  <div class="poster">
    <img src="img/logo/concierto.jpg" alt="Concierto">
  </div>

  <!-- Vista de verificación de código -->
  <div class="form-container" *ngIf="!mostrarCambioContrasena">
    <h1>Verifica tu correo</h1>
    <p class="subtitle">Hemos enviado un número de verificación a tu correo. Introduce el código en el recuadro inferior</p>

    <form class="verification-form" (submit)="validarCodigo($event)">
      <div class="code-instruction">Introduce el código</div>

      <div class="code-inputs">
        <input type="text" class="code-input" maxlength="1" pattern="[0-9]">
        <input type="text" class="code-input" maxlength="1" pattern="[0-9]">
        <input type="text" class="code-input" maxlength="1" pattern="[0-9]">
        <input type="text" class="code-input" maxlength="1" pattern="[0-9]">
        <input type="text" class="code-input" maxlength="1" pattern="[0-9]">
        <input type="text" class="code-input" maxlength="1" pattern="[0-9]">
      </div>

      <div class="resend-wrap">
        <span class="resend-text">¿No lo has recibido? </span>
        <a class="resend-link" (click)="mostrarReenvio($event)">Volver a enviar</a>
      </div>

      <button type="submit" class="btn-login">Continuar</button>
    </form>
  </div>

<!-- Vista de cambio de contraseña -->
<div class="form-container" *ngIf="mostrarCambioContrasena">
  <form class="password-form" (submit)="cambiarContrasena($event)">
    <h1>Recupera tu Contraseña</h1>
    <p class="subtitle">Ingrese su nueva contraseña</p>

    <label class="input-label">Nueva contraseña:</label>
    <input 
      type="password" 
      id="nuevaContrasena"
      placeholder="Complete el campo" 
      required>
    
    <label class="input-label">Repita la nueva contraseña:</label>
    <input 
      type="password" 
      id="repetirContrasena"
      placeholder="Complete el campo" 
      required>

    <div class="button-group">
      <button type="button" class="btn-cancel" (click)="cancelar()">Cancelar</button>
      <button type="submit" class="btn-submit">Siguiente</button>
    </div>
  </form>
</div>
