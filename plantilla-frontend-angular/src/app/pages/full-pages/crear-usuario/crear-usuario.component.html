<header class="header">
  <div class="logo" (click)="navigateToHome()">
    <img src="img/logo/logo-fasticket.jpg" alt="FASTICKET">
  </div>
  <div class="header-buttons">
    <button class="btn-header" (click)="router.navigate(['/login'])">Iniciar Sesion</button>
    <!-- Botón con icono de casita -->
    <button class="btn-icon" (click)="router.navigate(['/home'])">
      <img src="img/logo/home.jpg" alt="Inicio">
    </button>
  </div>
</header>

<div class="login-container">
  <!-- Lado izquierdo con la imagen -->
  <div class="poster">
    <img src="img/logo/concierto.jpg" alt="Concierto">
  </div>

<!-- Lado derecho con el formulario de registro -->
  <div class="form-container">
    <h1>¡Crea tu cuenta!</h1>
    <p class="subtitle">Regístrate y accede a muchos beneficios</p>

    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
      <input type="text" placeholder="Nombres *" formControlName="nombres" required>
      <input type="text" placeholder="Apellidos *" formControlName="apellidos" required>
      <input type="email" placeholder="Correo Electrónico *" formControlName="correo" required>
      <input type="password" placeholder="Contraseña *" formControlName="contrasena" required>
      <input type="password" placeholder="Repita Contraseña *" formControlName="repitaContrasena" required>

      <div class="form-row">
        <div class="form-group form-group-date">
          <input type="date" placeholder="Fecha de nacimiento *" formControlName="fechaNacimiento" required>
        </div>

        <!-- Departamento -->
        <div class="form-group form-group-departamento">
          <select
            id="departamento"
            placeholder="Departamento *"
            formControlName="departamento"
            class="form-control">
            <option value="">Departamento *</option>
            <option *ngFor="let dep of departamentos" [value]="dep.idDepartamento">
              {{ dep.nombre }}
            </option>
          </select>
        </div>

        <!-- Provincia -->
        <div class="form-group form-group-provincia">
          <select
            id="provincia"
            placeholder="Provincia *"
            formControlName="provincia"
            class="form-control"
            [disabled]="!provincias.length || loadingProvincias">
            <option value="">
              {{ loadingProvincias ? 'Cargando...' : 'Provincia *' }}
            </option>
            <option *ngFor="let prov of provincias" [value]="prov.idProvincia">
              {{ prov.nombre }}
            </option>
          </select>
        </div>

        <!-- Distrito -->
        <div class="form-group form-group-distrito">
          <select
            id="distrito"
            placeholder="Distrito *"
            formControlName="distrito"
            class="form-control"
            [disabled]="!distritos.length || loadingDistritos">
            <option value="">
              {{ loadingDistritos ? 'Cargando...' : 'Distrito *' }}
            </option>
            <option *ngFor="let dist of distritos" [value]="dist.idDistrito">
              {{ dist.nombre }}
            </option>
          </select>
        </div>
      </div>

      <input type="text" placeholder="Dirección domiciliaria *" formControlName="direccion" required>

      <div class="form-row">
        <div class="form-group form-group-telefono">
          <input type="tel" placeholder="Número de Teléfono *" formControlName="telefono"
                 maxlength="9"
                 (keypress)="onlyNumbers($event)"
                 (paste)="onPaste($event, 'telefono')"
                 required>
        </div>
        <div class="form-group form-group-tipo-doc">
          <select formControlName="tipoDocumento" required>
            <option value="">Tipo de Documento *</option>
            <option value="DNI">DNI</option>
            <option value="PASAPORTE">Pasaporte</option>
            <option value="ce">Carnet de Extranjería</option>
          </select>
        </div>
        <div class="form-group form-group-num-doc">
          <input type="text" placeholder="Número de Documento *" formControlName="numeroDocumento"
                 maxlength="8"
                 (keypress)="onlyNumbers($event)"
                 (paste)="onPaste($event, 'numeroDocumento')"
                 required>
        </div>
      </div>

      <button type="button" class="btn-login" (click)="onSubmit()">Continuar</button>

      <p class="terms-text">
        Al registrarse acepta los <a href="#" (click)="mostrarTerminos($event)">Términos del Servicio</a><br>
        y la <a href="#"  (click)="mostrarPoliticas($event)">Política de Privacidad</a>
      </p>
    </form>
  </div>

</div>
