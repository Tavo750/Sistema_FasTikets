<header class="header">
  <div class="logo" (click)="navigateToHome()">
    <img src="img/logo/logo-fasticket.jpg" alt="FASTICKET">
  </div>
  <div class="header-buttons">
    <button class="btn-header" (click)="router.navigate(['/login'])">Iniciar Sesion</button>
    <!-- Botón con icono de casita -->
    <button class="btn-icon" (click)="router.navigate(['/home'])">
      <img src="img/logo/home.jpg" alt="Inicio">
    </button>
  </div>
</header>

<div class="login-container">
  <!-- Lado izquierdo con la imagen -->
  <div class="poster">
    <img src="img/logo/concierto.jpg" alt="Concierto">
  </div>

<!-- Lado derecho con el formulario de registro -->
  <div class="form-container">
    <h1>¡Crea tu cuenta!</h1>
    <p class="subtitle">Regístrate y accede a muchos beneficios</p>

    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
      <!-- Nombres -->
      <p-floatlabel>
        <input pInputText id="nombres" formControlName="nombres" class="w-full" />
        <label for="nombres">Nombres *</label>
      </p-floatlabel>

      <!-- Apellidos -->
      <p-floatlabel>
        <input pInputText id="apellidos" formControlName="apellidos" class="w-full" />
        <label for="apellidos">Apellidos *</label>
      </p-floatlabel>

      <!-- Correo -->
      <p-floatlabel>
        <input pInputText id="correo" type="email" formControlName="correo" class="w-full" />
        <label for="correo">Correo Electrónico *</label>
      </p-floatlabel>

      <!-- Contraseña -->
      <p-floatlabel>
        <p-password
          id="contrasena"
          formControlName="contrasena"
          [toggleMask]="true"
          [feedback]="false"
          styleClass="w-full"
          inputStyleClass="w-full">
        </p-password>
        <label for="contrasena">Contraseña *</label>
      </p-floatlabel>

      <!-- Repetir Contraseña -->
      <p-floatlabel>
        <p-password
          id="repitaContrasena"
          formControlName="repitaContrasena"
          [toggleMask]="true"
          [feedback]="false"
          styleClass="w-full"
          inputStyleClass="w-full">
        </p-password>
        <label for="repitaContrasena">Repita Contraseña *</label>
      </p-floatlabel>

      <div class="form-row">
        <!-- Fecha de Nacimiento -->
        <div class="form-group form-group-date">
          <p-floatlabel>
            <p-datepicker
              id="fechaNacimiento"
              formControlName="fechaNacimiento"
              dateFormat="dd/mm/yy"
              [showIcon]="true"
              iconDisplay="input"
              [maxDate]="maxDate"
              styleClass="w-full"
              inputStyleClass="w-full">
            </p-datepicker>
            <label for="fechaNacimiento">Fecha de Nacimiento *</label>
          </p-floatlabel>
        </div>

        <!-- Departamento -->
        <div class="form-group form-group-departamento">
          <p-floatlabel>
            <p-select
              id="departamento"
              formControlName="departamento"
              [options]="departamentos"
              optionLabel="nombre"
              optionValue="idDepartamento"
              placeholder="Seleccione"
              styleClass="w-full">
            </p-select>
            <label for="departamento">Departamento *</label>
          </p-floatlabel>
        </div>

        <!-- Provincia -->
        <div class="form-group form-group-provincia">
          <p-floatlabel>
            <p-select
              id="provincia"
              formControlName="provincia"
              [options]="provincias"
              optionLabel="nombre"
              optionValue="idProvincia"
              [disabled]="!provincias.length || loadingProvincias"
              [placeholder]="loadingProvincias ? 'Cargando...' : 'Seleccione'"
              styleClass="w-full">
            </p-select>
            <label for="provincia">Provincia *</label>
          </p-floatlabel>
        </div>

        <!-- Distrito -->
        <div class="form-group form-group-distrito">
          <p-floatlabel>
            <p-select
              id="distrito"
              formControlName="distrito"
              [options]="distritos"
              optionLabel="nombre"
              optionValue="idDistrito"
              [disabled]="!distritos.length || loadingDistritos"
              [placeholder]="loadingDistritos ? 'Cargando...' : 'Seleccione'"
              styleClass="w-full">
            </p-select>
            <label for="distrito">Distrito *</label>
          </p-floatlabel>
        </div>
      </div>

      <!-- Dirección -->
      <p-floatlabel>
        <input pInputText id="direccion" formControlName="direccion" class="w-full" />
        <label for="direccion">Dirección domiciliaria *</label>
      </p-floatlabel>

      <div class="form-row">
        <!-- Teléfono -->
        <div class="form-group form-group-telefono">
          <p-floatlabel>
            <input
              pInputText
              id="telefono"
              formControlName="telefono"
              maxlength="9"
              (keypress)="onlyNumbers($event)"
              (paste)="onPaste($event, 'telefono')"
              class="w-full" />
            <label for="telefono">Número de Teléfono *</label>
          </p-floatlabel>
        </div>

        <!-- Tipo de Documento -->
        <div class="form-group form-group-tipo-doc">
          <p-floatlabel>
            <p-select
              id="tipoDocumento"
              formControlName="tipoDocumento"
              [options]="tiposDocumentoOptions"
              optionLabel="label"
              optionValue="value"
              placeholder="Seleccione"
              styleClass="w-full">
            </p-select>
            <label for="tipoDocumento">Tipo de Documento *</label>
          </p-floatlabel>
        </div>

        <!-- Número de Documento -->
        <div class="form-group form-group-num-doc">
          <p-floatlabel>
            <input
              pInputText
              id="numeroDocumento"
              formControlName="numeroDocumento"
              maxlength="8"
              (keypress)="onlyNumbers($event)"
              (paste)="onPaste($event, 'numeroDocumento')"
              class="w-full" />
            <label for="numeroDocumento">Número de Documento *</label>
          </p-floatlabel>
        </div>
      </div>

      <p-button
        type="button"
        label="Continuar"
        (onClick)="onSubmit()"
        styleClass="w-full btn-login">
      </p-button>

      <p class="terms-text">
        Al registrarse acepta los <a href="#" (click)="mostrarTerminos($event)">Términos del Servicio</a><br>
        y la <a href="#"  (click)="mostrarPoliticas($event)">Política de Privacidad</a>
      </p>
    </form>
  </div>

</div>

<!-- Modal de Verificación de Correo con PrimeNG -->
<p-dialog
  [(visible)]="mostrarModalVerificacion"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  header="Verificación de Correo"
  styleClass="modal-verificacion"
  [style]="{width: '450px'}"
  (onHide)="cerrarModalVerificacion()">

  <div class="modal-body">
    <p class="modal-description">
      Hemos enviado un código de verificación a <strong>{{ correoAVerificar }}</strong>
    </p>

    <div class="codigo-input-container">
      <label for="codigo-0">Ingrese el código de verificación:</label>
      <div class="codigo-boxes">
        <input
          pInputText
          *ngFor="let digit of codigoDigitos; let i = index"
          type="text"
          [id]="'codigo-' + i"
          [value]="codigoDigitos[i]"
          (keypress)="onCodigoKeypress($event, i)"
          (keydown)="onCodigoKeydown($event, i)"
          (paste)="onCodigoPaste($event, i)"
          [disabled]="verificandoCodigo"
          maxlength="1"
          class="codigo-box"
          inputmode="numeric"
          pattern="[0-9]*"
          autocomplete="off">
      </div>
    </div>

    <div class="modal-actions">
      <p-button
        label="{{ verificandoCodigo ? 'Verificando...' : 'Verificar' }}"
        icon="pi pi-check"
        (onClick)="validarCodigo()"
        [disabled]="!codigoCompleto() || verificandoCodigo"
        styleClass="p-button-success w-full mb-2">
      </p-button>

      <p-button
        label="{{ enviandoCodigo ? 'Enviando...' : 'Reenviar código' }}"
        icon="pi pi-refresh"
        (onClick)="reenviarCodigo()"
        [disabled]="enviandoCodigo"
        styleClass="p-button-secondary w-full"
        [outlined]="true">
      </p-button>
    </div>
  </div>
</p-dialog>
