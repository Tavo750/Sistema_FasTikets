<div class="page">
  <div class="content-container form-card">
    <div class="header-row">
      <h1 class="title">Editar código promocional</h1>
      <p-button label="Volver" icon="pi pi-arrow-left" severity="secondary"
                [routerLink]="['/administrador/codigosPromocionales']"></p-button>
    </div>

    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="form-grid">
        <div class="field">
          <label>Código <span class="req">*</span></label>
          <input pInputText formControlName="codigo" />
        </div>

        <div class="field col-span-2">
          <label>Descripción</label>
          <input pInputText formControlName="descripcion" />
        </div>

        <div class="field">
          <label>Fecha de expiración <span class="req">*</span></label>
          <p-calendar formControlName="fechaFin" dateFormat="dd/mm/yy" [showIcon]="true" [showTime]="true"></p-calendar>
        </div>

        <div class="field">
          <label>Tipo <span class="req">*</span></label>
          <p-dropdown formControlName="tipo" [options]="tipos" optionLabel="label" optionValue="value"></p-dropdown>
        </div>

        <div class="field">
          <label>Valor <span class="req">*</span></label>
          <p-inputNumber formControlName="valor" [minFractionDigits]="2" [maxFractionDigits]="2" 
                         [min]="0" [step]="0.5"></p-inputNumber>
        </div>

        <div class="field">
          <label>Stock disponible <span class="req">*</span></label>
          <p-inputNumber formControlName="stock" [min]="0" [showButtons]="true"></p-inputNumber>
        </div>

        <div class="field">
          <label>Cantidad por cliente <span class="req">*</span></label>
          <p-inputNumber formControlName="cantidadPorCliente" [min]="1" [showButtons]="true"></p-inputNumber>
        </div>
      </div>

      <div class="footer-actions">
        <p-button label="Guardar" type="submit" styleClass="p-button-success" [loading]="loading"></p-button>
      </div>
    </form>
  </div>
</div>
