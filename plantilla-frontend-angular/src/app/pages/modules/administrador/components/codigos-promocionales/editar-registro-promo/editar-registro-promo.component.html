<div class="container">
  <div class="content-container">
    <div class="header-section">
      <h1 class="title">
        <i class="pi pi-pencil"></i>
        Editar Código Promocional
      </h1>

      <p-button
        label="Volver"
        icon="pi pi-arrow-left"
        severity="secondary"
        [routerLink]="['/administrador/codigosPromocionales']"
        >
      </p-button>
    </div>

    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="form-grid">
        <div class="field">
          <label for="codigo">Código <span class="required">*</span></label>
          <input
            id="codigo"
            pInputText
            formControlName="codigo"
            class="input-field" />
        </div>

        <div class="field col-span-2">
          <label for="descripcion">Descripción</label>
          <input
            id="descripcion"
            pInputText
            formControlName="descripcion"
            class="input-field" />
        </div>

        <div class="field">
          <label for="fechaFin">Fecha de expiración <span class="required">*</span></label>
          <p-calendar
            id="fechaFin"
            formControlName="fechaFin"
            dateFormat="dd/mm/yy"
            [showIcon]="true"
            [showTime]="true"
            class="calendar-field">
          </p-calendar>
        </div>

        <div class="field">
          <label for="tipo">Tipo <span class="required">*</span></label>
          <p-dropdown
            id="tipo"
            formControlName="tipo"
            [options]="tipos"
            optionLabel="label"
            optionValue="value"
            class="dropdown-field">
          </p-dropdown>
        </div>

        <div class="field">
          <label for="valor">Valor <span class="required">*</span></label>
          <p-inputNumber
            id="valor"
            formControlName="valor"
            [minFractionDigits]="2"
            [maxFractionDigits]="2"
            [min]="0"
            [step]="0.5"
            class="number-field">
          </p-inputNumber>
        </div>

        <div class="field">
          <label for="stock">Stock disponible <span class="required">*</span></label>
          <p-inputNumber
            id="stock"
            formControlName="stock"
            [min]="0"
            [showButtons]="true"
            class="number-field">
          </p-inputNumber>
        </div>

        <div class="field">
          <label for="cantidadPorCliente">Cantidad por cliente <span class="required">*</span></label>
          <p-inputNumber
            id="cantidadPorCliente"
            formControlName="cantidadPorCliente"
            [min]="1"
            [showButtons]="true"
            class="number-field">
          </p-inputNumber>
        </div>
      </div>

      <div class="footer-actions">
        <p-button
          label="Guardar Cambios"
          type="submit"
          [loading]="loading"
          icon="pi pi-check">
        </p-button>
      </div>
    </form>
  </div>
</div>
