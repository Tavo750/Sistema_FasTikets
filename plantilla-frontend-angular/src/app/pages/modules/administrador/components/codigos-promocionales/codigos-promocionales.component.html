<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="gestion-codigos-container">
  <div class="header-section">
    <div class="title-group">
      <h2 class="page-title">Lista de Códigos Promocionales</h2>
      <i class="pi pi-tags"></i>
    </div>

    <div class="acciones-header">
      <span class="p-input-icon-left buscador-codigos">
        <i class="pi pi-search"></i>
        <input 
          pInputText 
          type="text" 
          placeholder="Filtrar por código o ID" 
          [(ngModel)]="filtro" />
      </span>

      <p-button 
        label="Agregar nuevo código" 
        icon="pi pi-plus" 
        [routerLink]="['/administrador/codigosPromocionales/registro']" 
        styleClass="btn-agregar">
      </p-button>
    </div>
  </div>

  <p-table
    [value]="codigosFiltrados"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10,25,50]"
    [rowHover]="true"
    [responsiveLayout]="'scroll'"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} códigos"
    styleClass="tabla-codigos">

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="id">ID <p-sortIcon field="id"></p-sortIcon></th>
        <th pSortableColumn="codigo">Código <p-sortIcon field="codigo"></p-sortIcon></th>
        <th>Descripción</th>
        <th pSortableColumn="fechaExpiracion">Fecha expiración <p-sortIcon field="fechaExpiracion"></p-sortIcon></th>
        <th>Valor</th>
        <th class="acciones-col">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.id }}</td>
        <td class="codigo-mono">{{ row.codigo }}</td>
        <td>{{ row.descripcion }}</td>
        <td>{{ row.fechaExpiracion }}</td>
        <td>
          <ng-container *ngIf="row.tipo === 'PORCENTAJE'; else dinero">
            {{ row.valor }} %
          </ng-container>
          <ng-template #dinero>S/. {{ row.valor }}</ng-template>
        </td>
        <td class="acciones-cell">
          <div class="action-buttons">
            <p-button icon="pi pi-eye" [text]="true" [rounded]="true" severity="info"
                      [routerLink]="['/administrador/codigosPromocionales/detalle', row.id]"></p-button>
            <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="success"
                      [routerLink]="['/administrador/codigosPromocionales/editar', row.id]"></p-button>
            <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger"
                      (click)="confirmarEliminar(row)"></p-button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
