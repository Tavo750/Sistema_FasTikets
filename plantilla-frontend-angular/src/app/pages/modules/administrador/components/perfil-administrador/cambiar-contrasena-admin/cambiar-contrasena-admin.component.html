<div class="card">
    <div class="dentroCard">
    <form [formGroup]="cambiarContrasenaForm!" (ngSubmit)="onSubmit()" class="form-narrow">
        <h2>Cambiar mi contraseña</h2>
        <div class="form-group">
            <label>Contraseña actual</label>
            <input type="password" pInputText formControlName="contrasenaActual" 
                   [class.ng-invalid]="hasFieldError('contrasenaActual')">
            <small class="error-message" *ngIf="hasFieldError('contrasenaActual')">
                {{ getFieldErrorMessage('contrasenaActual') }}
            </small>
        </div>
        
        <div class="form-group">
            <label>Contraseña nueva</label>
            <input type="password" pInputText formControlName="contrasenaNueva"
                   [class.ng-invalid]="hasFieldError('contrasenaNueva')">
            <small class="error-message" *ngIf="hasFieldError('contrasenaNueva')">
                {{ getFieldErrorMessage('contrasenaNueva') }}
            </small>
        </div>
        
        <div class="form-group">
            <label>Repita la nueva contraseña</label>
            <input type="password" pInputText formControlName="confirmarContrasena"
                   [class.ng-invalid]="hasFieldError('confirmarContrasena')">
            <small class="error-message" *ngIf="hasFieldError('confirmarContrasena')">
                {{ getFieldErrorMessage('confirmarContrasena') }}
            </small>
        </div>

        <!-- Mensajes de éxito y error -->
        <div class="message-container" *ngIf="mensajeExito || mensajeError">
            <div class="success-message" *ngIf="mensajeExito">
                <i class="pi pi-check-circle"></i>
                {{ mensajeExito }}
            </div>
            <div class="error-message" *ngIf="mensajeError">
                <i class="pi pi-exclamation-triangle"></i>
                {{ mensajeError }}
            </div>
        </div>

        <div class="button-container">
            <button pButton type="button" label="Volver" class="p-button-danger" 
                    [routerLink]="['/administrador/perfilAdministrador']">
            </button>
            <button pButton type="submit" class="p-button-success"
                    [disabled]="!cambiarContrasenaForm?.valid || cargando"
                    [loading]="cargando">
                <span *ngIf="!cargando">Cambiar</span>
                <span *ngIf="cargando">Cambiando...</span>
            </button>
        </div>
    </form>
    </div>
</div>
