<div class="card overflow-hidden">
    <div class="grid p-fluid" style="height: calc(100vh - 150px); overflow-y: auto;">
        <!-- Datos Generales -->
         <div class="field">
         </div>
        <div class="grid">
            <div class="datos-generales-container">
                <h2 class="section-title">1. Datos generales</h2>

                <div class="form-grid">
                    <!-- Columna Izquierda -->
                    <div class="form-left">
                        <div class="field">
                            <label for="titulo">1) Título</label>
                            <input
                                id="titulo"
                                type="text"
                                pInputText
                                [(ngModel)]="evento.titulo"
                                placeholder="Ej. Soda Stereo..." />
                        </div>

                        <div class="field">
                            <label class="estado-label">2) Elige una categoría</label>
                            <p-dropdown
                                [(ngModel)]="evento.categoria"
                                [options]="categorias"
                                optionLabel="label"
                                optionValue="value"
                                placeholder="Seleccionar">
                            </p-dropdown>
                        </div>

                        <div class="field">
                            <label for="descripcion">3) Descripción</label>
                            <textarea
                                id="descripcion"
                                rows="4"
                                pInputTextarea
                                [(ngModel)]="evento.descripcion"
                                placeholder="Ej. Concierto que conmemora...">
                            </textarea>
                        </div>

                        <div class="field">
                            <label>4) Fecha</label>
                            <div class="fecha-inputs">
                              <p-datepicker
                              [(ngModel)]="date"
                              dateFormat="dd/mm/yy"
                               />
                            </div>
                        </div>

                        <div class="field">
                            <label>5) Hora</label>
                            <div class="hora-section">
                                <label class="hora-label">Hora Inicio:</label>
                                <p-datepicker
                                    inputId="calendar-timeonly"
                                    [(ngModel)]="time"
                                    [timeOnly]="true"
                                    class="hora-picker" />
                            </div>
                        </div>
                    </div>

                    <!-- Columna Derecha -->
                    <div class="form-right">
                        <div class="field">
                            <label>6) Banner</label>
                            <div class="banner-container">
                                <!-- Mostrar imagen actual del banner -->
                                <div class="banner-display" *ngIf="evento.bannerUrl || usarBannerDefault" (click)="fileInput.click()">
                                    <img
                                        [src]="evento.bannerUrl"
                                        alt="Banner del evento"
                                        class="banner-imagen">
                                    <div class="banner-overlay">
                                        <i class="pi pi-camera upload-overlay-icon"></i>
                                        <p class="upload-overlay-text">Cambiar imagen</p>
                                    </div>
                                </div>

                                <!-- Área de subida cuando no hay imagen -->
                                <div class="upload-area-banner" (click)="fileInput.click()" *ngIf="!evento.bannerUrl && !usarBannerDefault">
                                    <i class="pi pi-image upload-icon"></i>
                                    <p class="upload-text">Subir imagen del banner</p>
                                </div>

                                <!-- Input file oculto -->
                                <input
                                    #fileInput
                                    type="file"
                                    accept="image/*"
                                    (change)="onFileSelected($event)"
                                    style="display: none" />
                            </div>

                            <!-- Botones de acción para el banner -->
                            <div class="banner-actions" *ngIf="evento.bannerUrl">
                                <p-button
                                    label="Cambiar imagen"
                                    icon="pi pi-upload"
                                    styleClass="p-button-outlined p-button-sm"
                                    (onClick)="fileInput.click()">
                                </p-button>
                                <p-button
                                    label="Eliminar"
                                    icon="pi pi-trash"
                                    styleClass="p-button-outlined p-button-danger p-button-sm"
                                    (onClick)="onEliminarBanner()">
                                </p-button>
                            </div>
                        </div>

                        <div class="field">
                            <label for="videoPromocional">7) Video Promocional</label>
                            <input
                                id="videoPromocional"
                                type="text"
                                pInputText
                                [(ngModel)]="evento.videoPromocional"
                                placeholder="Link..." />
                        </div>

                        <div class="field">
                            <label>Publicar:</label>
                            <div class="publicar-options">
                                <div class="publicar-option">
                                    <p-checkbox
                                        [(ngModel)]="publicarInmediatamente"
                                        binary="true"
                                        inputId="inmediatamente"
                                        (onChange)="onPublicarInmediatamente()">
                                    </p-checkbox>
                                    <label for="inmediatamente" class="checkbox-label">Inmediatamente</label>
                                </div>

                                <div class="publicar-option">
                                    <p-checkbox
                                        [(ngModel)]="publicarAPartirDe"
                                        binary="true"
                                        inputId="apartirDe"
                                        (onChange)="onPublicarAPartirDe()">
                                    </p-checkbox>
                                    <label for="apartirDe" class="checkbox-label">A partir de:</label>
                                    <p-datepicker
                                        [(ngModel)]="fechaPublicacion"
                                        placeholder="fecha"
                                        [disabled]="!publicarAPartirDe"
                                        class="fecha-publicacion" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Local y Asientos -->
        <div class="field">
         </div>
        <div class="grid">
            <div class="datos-generales-container">
                <h2 class="section-title">2. Local y asientos</h2>

                <!-- 1) Selecciona el local -->
                <div class="local-section">
                    <h3 class="subsection-title">1) Selecciona el local</h3>
                    <div class="field">
                        <p-dropdown
                            [(ngModel)]="evento.local"
                            [options]="localesOptions"
                            optionLabel="label"
                            optionValue="value"
                            placeholder="Seleccionar"
                            class="local-dropdown">
                        </p-dropdown>
                    </div>
                </div>

                <div class="local-asientos-grid">
                    <!-- 2) Categorías -->
                    <div class="categorias-section">
                        <h3 class="subsection-title">2) Categorías</h3>

                        <div class="categoria-input-row">
                            <div class="input-group">
                                <label>Nombre</label>
                                <input
                                    type="text"
                                    pInputText
                                    [(ngModel)]="nuevaCategoria.nombre"
                                    placeholder="General"
                                    class="categoria-input" />
                            </div>

                            <div class="input-group">
                                <label>Aforo Máximo</label>
                                <input
                                    type="number"
                                    pInputText
                                    [(ngModel)]="nuevaCategoria.aforoMaximo"
                                    placeholder="1000"
                                    class="categoria-input" />
                            </div>

                            <div class="add-button-container">
                                <p-button
                                    icon="pi pi-plus"
                                    styleClass="p-button-outlined p-button-sm"
                                    (onClick)="onAgregarCategoria()">
                                </p-button>
                            </div>
                        </div>

                        <!-- Lista de categorías agregadas -->
                        <div class="categorias-agregadas" *ngIf="categoriasLocal && categoriasLocal.length > 0">
                            <div class="categoria-item" *ngFor="let categoria of categoriasLocal; let i = index">
                                <span class="categoria-nombre">{{ categoria.nombre }}</span>
                                <span class="categoria-aforo">{{ categoria.aforoMaximo }}</span>
                                <p-button
                                    icon="pi pi-trash"
                                    styleClass="p-button-text p-button-danger p-button-sm"
                                    (onClick)="onEliminarCategoria(i)">
                                </p-button>
                            </div>
                        </div>
                    </div>

                    <!-- 3) Mapa -->
                    <div class="mapa-section">
                        <h3 class="subsection-title">3) Mapa</h3>
                        <div class="mapa-container">
                            <!-- Mostrar imagen actual o por defecto -->
                            <div class="mapa-display" *ngIf="evento.mapaUrl || usarMapaDefault" (click)="fileInputMapa.click()">
                                <img
                                    [src]="evento.mapaUrl"
                                    alt="Mapa del local"
                                    class="mapa-imagen">
                                <div class="mapa-overlay">
                                    <i class="pi pi-camera upload-overlay-icon"></i>
                                    <p class="upload-overlay-text">Cambiar imagen</p>
                                </div>
                            </div>

                            <!-- Área de subida cuando no hay imagen -->
                            <div class="upload-area-mapa" (click)="fileInputMapa.click()" *ngIf="!evento.mapaUrl && !usarMapaDefault">
                                <i class="pi pi-image upload-icon"></i>
                                <p class="upload-text">Subir imagen del mapa</p>
                            </div>

                            <!-- Input file oculto -->
                            <input
                                #fileInputMapa
                                type="file"
                                accept="image/*"
                                (change)="onMapaSelected($event)"
                                style="display: none" />
                        </div>

                        <!-- Botones de acción para el mapa -->
                        <div class="mapa-actions" *ngIf="evento.mapaUrl">
                            <p-button
                                label="Cambiar imagen"
                                icon="pi pi-upload"
                                styleClass="p-button-outlined p-button-sm"
                                (onClick)="fileInputMapa.click()">
                            </p-button>
                            <p-button
                                label="Eliminar"
                                icon="pi pi-trash"
                                styleClass="p-button-outlined p-button-danger p-button-sm"
                                (onClick)="onEliminarMapa()">
                            </p-button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Entradas -->
        <div class="field">
         </div>
         <div class="grid">
            <div class="datos-generales-container">
                <h2 class="section-title">3. Entradas</h2>

                <!-- Moneda Field -->
                <div class="field moneda-field">
                    <label for="moneda">Moneda</label>
                    <p-dropdown
                        [(ngModel)]="evento.moneda"
                        [options]="monedaOptions"
                        optionLabel="label"
                        optionValue="value"
                        placeholder="Seleccionar"
                        class="moneda-dropdown">
                    </p-dropdown>
                </div>

                <!-- Entrada Row -->
                <div class="entrada-row">
                    <div class="entrada-field">
                        <label>Nombre</label>
                        <input
                            type="text"
                            pInputText
                            [(ngModel)]="entradaNombre"
                            placeholder="Regular"
                            class="entrada-nombre-input" />
                    </div>

                    <div class="entrada-field valido-para-field">
                        <label>Válido para</label>
                        <p-dropdown
                            [(ngModel)]="validoPara"
                            [options]="validoParaOptions"
                            optionLabel="label"
                            optionValue="value"
                            placeholder="Seleccionar"
                            class="valido-para-dropdown">
                        </p-dropdown>
                    </div>

                    <div class="entrada-actions">
                        <p-button
                            label="Agregar entrada"
                            icon="pi pi-plus"
                            styleClass="p-button-outlined"
                            (onClick)="onAgregarEntrada()">
                        </p-button>
                    </div>
                </div>

                <!-- Límite de compra -->
                <div class="limite-compra-section">
                    <label>Límite:</label>
                    <div class="limite-options">
                        <div class="limite-option">
                            <p-radioButton
                                [(ngModel)]="limiteCompra.tipo"
                                name="limiteCompra"
                                value="sinLimite"
                                inputId="sinLimite">
                            </p-radioButton>
                            <label for="sinLimite">Sin Límite</label>
                        </div>

                        <div class="limite-option">
                            <p-radioButton
                                [(ngModel)]="limiteCompra.tipo"
                                name="limiteCompra"
                                value="conMaximo"
                                inputId="conMaximo">
                            </p-radioButton>
                            <label for="conMaximo">Máximo:</label>
                            <input
                                type="number"
                                pInputText
                                [(ngModel)]="limiteCompra.maximo"
                                placeholder="10"
                                class="maximo-input"
                                [disabled]="limiteCompra.tipo !== 'conMaximo'" />
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <!-- Botones de acción -->
        <div class="justify-content-center">
            <div class=" justify-content-center ">
                <p-button
                    class="justify-content-center"
                    label="Cancelar"
                    styleClass="p-button-danger"
                    (onClick)="onCancelarEvento()">
                </p-button>
                <p-button
                    class="justify-content-center"
                    label="Crear Evento"
                    styleClass="p-button-primary"
                    (onClick)="onGuardarCambios()">
                </p-button>
            </div>
        </div>
    </div>
</div>
