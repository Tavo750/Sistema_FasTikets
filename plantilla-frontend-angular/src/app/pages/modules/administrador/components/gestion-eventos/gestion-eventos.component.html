<div class="container">
    <h1 class="title">Gestion De Eventos</h1>
    
    <div class="search-container">
        <span class="p-input-icon-left search-box">
            <i class="pi pi-search"></i>
            <input type="text" pInputText placeholder="Escribir el nombre del evento"/>
        </span>
        
        <p-dropdown [options]="tiposConcierto" optionLabel="name" placeholder="Tipo de concierto" class="filter-dropdown"></p-dropdown>
    </div>

    <div class="events-list">
        <div class="event-card">
            <div class="event-header">
                <div class="event-title">
                    <h2>Bad Bunny</h2>
                    <span class="event-status">Completado</span>
                </div>
                <div class="event-details">
                    <span><i class="pi pi-calendar"></i> 14 de marzo de 2024</span>
                    <span><i class="pi pi-map-marker"></i> Estadio Nacional Peru</span>
                </div>
            </div>
            
            <div class="event-stats">
                <div class="stat-item">
                    <label>Capacidad:</label>
                    <span>45000</span>
                </div>
                <div class="stat-item">
                    <label>Vendidos:</label>
                    <span class="sold">45200</span>
                </div>
                <div class="stat-item">
                    <label>Ocupación:</label>
                    <span class="percentage">95.4%</span>
                </div>
                <div class="stat-item">
                    <label>Ingresos:</label>
                    <span class="income">$333,874,000.992</span>
                </div>
            </div>
            
            <div class="event-actions">
                <button pButton type="button" label="Reporte" icon="pi pi-download" class="p-button-secondary"></button>
                <button pButton type="button" label="Ver Detalles" icon="pi pi-eye"></button>
                <button pButton type="button" icon="pi pi-copy" class="p-button-rounded p-button-text"></button>
            </div>
        </div>
    </div>
    
    <button pButton type="button" label="Agregar Evento" icon="pi pi-plus" class="add-event-button"></button>
</div>
