<div class="card overflow-hidden">
    <div class="grid p-fluid" style="height: calc(100vh - 150px); overflow-y: auto;">
        <!-- Datos Generales -->
        <div class="col-12">
            <p-panel header="Datos generales" styleClass="mb-3">
                <div class="grid">
                    <div class="col-12 flex justify-content-end">
                        <div class="flex align-items-center gap-2">
                            <label class="font-bold">ESTADO:</label>
                            <span class="bg-primary text-white px-3 py-1 border-round">PUBLICADO</span>
                        </div>
                    </div>
                    
                    <div class="col-12 md:col-6">
                        <div class="field">
                            <label for="titulo" class="block font-bold mb-2">Título:</label>
                            <input pInputText id="titulo" [(ngModel)]="evento.titulo" class="w-full" placeholder="Electronic Festival"/>
                        </div>
                    </div>

                    <div class="col-12 md:col-6">
                        <div class="field">
                            <label for="categoria" class="block font-bold mb-2">Categoría:</label>
                            <input pInputText id="categoria" [(ngModel)]="evento.categoria" class="w-full" placeholder="Electrónica"/>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="field">
                            <label for="descripcion" class="block font-bold mb-2">Descripción:</label>
                            <textarea pInputTextarea id="descripcion" [(ngModel)]="evento.descripcion" 
                                    [rows]="3" class="w-full" placeholder="Descripción genérica de concierto porque no ando creativo..."></textarea>
                        </div>
                    </div>

                    <div class="col-12 md:col-8">
                        <div class="field">
                            <label class="block font-bold mb-2">Fecha:</label>
                            <div class="flex gap-3">
                                <p-calendar [(ngModel)]="evento.fecha" [showIcon]="true" 
                                          dateFormat="dd/mm/yy" placeholder="30" class="w-full"></p-calendar>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 md:col-4">
                        <div class="field">
                            <label class="block font-bold mb-2">Hora:</label>
                            <div class="flex gap-2 align-items-center">
                                <p-calendar 
                                    [(ngModel)]="evento.hora" 
                                    [iconDisplay]="'input'" 
                                    [showIcon]="true" 
                                    [timeOnly]="true" 
                                    inputId="templatedisplay">
                                        <ng-template pTemplate="inputicon" let-clickCallBack="clickCallBack">
                                            <i 
                                                class="pi pi-clock pointer-events-none pointer-events-none" 
                                                (click)="clickCallBack($event)"></i>
                                        </ng-template>
                                </p-calendar>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 md:col-6">
                        <div class="field">
                            <label class="block font-bold mb-2">Banner:</label>
                            <div class="border-2 border-dashed border-primary p-5 text-center cursor-pointer hover:bg-primary-50 transition-colors duration-200">
                                <i class="pi pi-upload text-4xl text-primary mb-2"></i>
                                <p-fileUpload mode="basic" chooseLabel="Subir Banner" 
                                            accept="image/*" [maxFileSize]="1000000" 
                                            styleClass="p-button-outlined" 
                                            (onSelect)="onSubirBanner($event)"></p-fileUpload>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 md:col-6">
                        <div class="field">
                            <label class="block font-bold mb-2">Video Promocional:</label>
                            <input pInputText type="text" placeholder="Link completamente normal..." class="w-full"/>
                        </div>
                    </div>
                </div>
            </p-panel>
        </div>

        <!-- Local y Asientos -->
        <div class="col-12">
            <p-panel header="Local y asientos" styleClass="mb-3">
                <div class="grid p-fluid">
                    <div class="col-12 md:col-6">
                        <span class="p-float-label mt-4">
                            <input pInputText id="local" [(ngModel)]="evento.local" class="w-full"/>
                            <label for="local">Local</label>
                        </span>
                    </div>
                    <div class="col-12 md:col-6">
                        <button pButton label="Ver Mapa" icon="pi pi-map" class="mt-4"></button>
                    </div>
                    <div class="col-12">
                        <p-table [value]="asientos" [scrollable]="true" scrollHeight="200px" class="mt-4">
                            <ng-template pTemplate="header">
                                <tr>
                                    <th>Nombre</th>
                                    <th>Aforo Máximo</th>
                                    <th>Aforo Disponible</th>
                                </tr>
                            </ng-template>
                            <ng-template pTemplate="body" let-asiento>
                                <tr>
                                    <td>{{asiento.nombre}}</td>
                                    <td>{{asiento.aforoMaximo}}</td>
                                    <td>{{asiento.aforoDisponible}}</td>
                                </tr>
                            </ng-template>
                        </p-table>
                    </div>
                </div>
            </p-panel>
        </div>

        <!-- Entradas -->
        <div class="col-12">
            <p-panel header="Entradas" styleClass="mb-3">
                <div class="grid p-fluid">
                    <div class="col-12">
                        <p-table [value]="entradas" [scrollable]="true" scrollHeight="200px">
                            <ng-template pTemplate="header">
                                <tr>
                                    <th>Nombre</th>
                                    <th>Categoría</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </ng-template>
                            <ng-template pTemplate="body" let-entrada>
                                <tr>
                                    <td>{{entrada.nombre}}</td>
                                    <td>{{entrada.categoria}}</td>
                                    <td>
                                        <p-dropdown [options]="estadosEntrada" [(ngModel)]="entrada.estado"
                                                  optionLabel="nombre"></p-dropdown>
                                    </td>
                                    <td>
                                        <button pButton icon="pi pi-pencil" class="p-button-text"></button>
                                        <button pButton icon="pi pi-trash" class="p-button-text p-button-danger"></button>
                                    </td>
                                </tr>
                            </ng-template>
                        </p-table>
                    </div>
                </div>
            </p-panel>
        </div>

        <!-- Botones de acción -->
        <div class="col-12">
            <div class="flex justify-content-end gap-2 py-3">
                <button pButton label="Cancelar Evento" class="p-button-danger" (click)="onCancelarEvento()"></button>
                <button pButton label="Guardar cambios" class="p-button-primary" (click)="onGuardarCambios()"></button>
            </div>
        </div>
    </div>
</div>
