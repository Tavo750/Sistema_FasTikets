
<p-toast></p-toast>

<div class="crear-local-container">
  <h2>1. Datos del Local</h2>

  <form [formGroup]="localForm">
    <div class="form-grid">
      <div class="form-left">
        <div class="form-group">
          <label for="nombre">1) Nombre</label>
          <input
            type="text"
            pInputText
            id="nombre"
            formControlName="nombre"
            placeholder="Ej. Centro de usos Múltiples..."
          />
        </div>

        <div class="form-group">
          <label for="direccion">2) Dirección</label>
          <input
            type="text"
            pInputText
            id="direccion"
            formControlName="direccion"
            placeholder="Ej. Av. Principal 123..."
          />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="distrito">3) Distrito</label>
            <div class="distrito-container">
              <p-select
                id="distrito"
                formControlName="distrito"
                [options]="distritos"
                optionLabel="label"
                optionValue="value"
                placeholder="Seleccionar..."
                styleClass="w-full distrito-select"
                (onChange)="centerMapOnDistrict()"
              ></p-select>
              <p-button
                icon="pi pi-map-marker"
                (onClick)="centerMapOnDistrict()"
                [disabled]="!localForm.get('distrito')?.value"
                class="distrito-btn"
                size="small"
                severity="secondary"
                outlined="true"
                pTooltip="Centrar mapa en distrito"
              ></p-button>
            </div>
          </div>

          <div class="form-group">
            <label for="aforo">4) Aforo máximo</label>
            <p-inputnumber
              id="aforo"
              formControlName="aforo"
              placeholder="Ej. 5000"
              [min]="1"
              [useGrouping]="false"
              styleClass="w-full"
            ></p-inputnumber>
          </div>
        </div>

        <div class="form-group">
          <label for="estado">5) Estado</label>
          <p-select
            id="estado"
            formControlName="estado"
            [options]="estados"
            optionLabel="label"
            optionValue="value"
            styleClass="w-full"
          ></p-select>
        </div>
      </div>

      <div class="form-right">
        <div class="form-group">
          <label>6) Ubicación</label>
          <div class="map-wrapper">
            <div id="map" class="map-container">
              <div class="map-loading" *ngIf="mapLoading">
                <div class="loading-spinner">
                  <p-progressSpinner strokeWidth="4" fill="#f0f0f0"></p-progressSpinner>
                </div>
                <p>Cargando mapa...</p>
              </div>
            </div>
          </div>
          <div class="coordinates-info">
            <small>
              <strong>Coordenadas:</strong>
              Lat: {{ selectedCoordinates.lat | number:'1.6-6' }},
              Lng: {{ selectedCoordinates.lng | number:'1.6-6' }}
            </small>
            <br>
            <small class="map-instructions">
              💡 Haz clic en el mapa o arrastra el marcador para seleccionar la ubicación
            </small>
            <br>
            <p-button
              *ngIf="!mapLoading"
              label="Recargar Mapa"
              icon="pi pi-refresh"
              size="small"
              severity="secondary"
              (onClick)="reloadMap()"
              class="mt-2"
            ></p-button>
          </div>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <p-button
        label="Crear Local"
        (onClick)="crearLocal()"
        [disabled]="localForm.invalid"
        styleClass="crear-btn"
      ></p-button>
    </div>
  </form>
</div>
