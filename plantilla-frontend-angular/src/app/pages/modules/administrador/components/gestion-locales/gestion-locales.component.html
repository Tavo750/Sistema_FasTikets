<div class="gestion-locales-container">
  <h2>Lista de Locales</h2>

  <div class="acciones">
    <div class="p-inputgroup">
      <input
        pInputText
        type="text"
        placeholder="Filtrar por nombre, distrito o estado"
        [(ngModel)]="globalFilterValue"
        (input)="applyGlobalFilter($event)"
        class="buscador"
      />
    </div>
    <p-button
      label="Crear nuevo local"
      icon="pi pi-plus"
      severity="success"
      (onClick)="crearNuevoLocal()"
      class="crear-btn">
    </p-button>
  </div>

  <p-table
    [value]="filteredLocales"
    [rows]="rows"
    [paginator]="true"
    [first]="first"
    [rowsPerPageOptions]="[5, 10, 20]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    [tableStyle]="{ 'min-width': '60rem' }"
    styleClass="p-datatable-gridlines"
    [loading]="false">

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="id">
          ID <p-sortIcon field="id"></p-sortIcon>
        </th>
        <th pSortableColumn="nombre">
          Nombre <p-sortIcon field="nombre"></p-sortIcon>
        </th>
        <th pSortableColumn="direccion">
          Dirección <p-sortIcon field="direccion"></p-sortIcon>
        </th>
        <th pSortableColumn="distrito">
          Distrito <p-sortIcon field="distrito"></p-sortIcon>
        </th>
        <th pSortableColumn="aforo">
          Aforo <p-sortIcon field="aforo"></p-sortIcon>
        </th>
        <th pSortableColumn="estado">
          Estado <p-sortIcon field="estado"></p-sortIcon>
        </th>
        <th>Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-local>
      <tr>
        <td>{{local.id}}</td>
        <td>{{local.nombre}}</td>
        <td>{{local.direccion}}</td>
        <td>{{local.distrito}}</td>
        <td>{{local.aforo | number}}</td>
        <td>
          <p-tag
            [value]="local.estado"
            [severity]="local.estado === 'HABILITADO' ? 'success' : 'danger'"
            class="estado-tag">
          </p-tag>
        </td>
        <td>
          <div class="acciones-fila">
            <p-button
              icon="pi pi-pencil"
              severity="info"
              size="small"
              [text]="true"
              [rounded]="true"
              pTooltip="Editar local"
              tooltipPosition="top"
              (onClick)="editarLocal(local.id)">
            </p-button>
            <p-button
              icon="pi pi-trash"
              severity="danger"
              size="small"
              [text]="true"
              [rounded]="true"
              pTooltip="Eliminar local"
              tooltipPosition="top"
              (onClick)="confirmarEliminacion(local, $event)">
            </p-button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="text-center">
          <div class="empty-state">
            <i class="pi pi-info-circle" style="font-size: 2rem; color: var(--gray-500);"></i>
            <p>No se encontraron locales</p>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <!-- Confirmación de eliminación -->
  <p-confirmDialog></p-confirmDialog>

  <!-- Toast para mensajes -->
  <p-toast></p-toast>
</div>
