<div class="container">
  <div class="header-section">
    <h1 class="title">
      <i class="pi pi-shield"></i>
      Registro de auditoría
    </h1>
    <p-button 
      label="Exportar PDF" 
      icon="pi pi-file-pdf" 
      severity="success"
      (onClick)="exportarPDF()"
      class="export-button">
    </p-button>
  </div>

  <p-panel header="Filtros de Búsqueda" [toggleable]="true" class="search-panel">
    <div class="search-container">
      <div class="filter-row">
        <div class="field">
          <label for="usuario">Usuario:</label>
          <p-dropdown 
            id="usuario"
            [(ngModel)]="filtroUsuario" 
            [options]="usuarioOptions" 
            optionLabel="label" 
            optionValue="value" 
            placeholder="Seleccione un usuario"
            class="w-full">
          </p-dropdown>
        </div>
        <div class="field">
          <label for="tipoEvento">Tipo de evento:</label>
          <p-dropdown 
            id="tipoEvento"
            [(ngModel)]="filtroTipoEvento" 
            [options]="tipoEventoOptions" 
            optionLabel="label" 
            optionValue="value" 
            placeholder="Seleccione un evento"
            class="w-full">
          </p-dropdown>
        </div>
        <div class="filter-actions">
          <p-button 
            label="Filtrar" 
            icon="pi pi-search" 
            (onClick)="filtrar()">
          </p-button>
          <p-button 
            label="Limpiar" 
            icon="pi pi-times" 
            severity="secondary" 
            (onClick)="limpiarFiltros()">
          </p-button>
        </div>
      </div>
    </div>
  </p-panel>

  <div class="results-section">
    <div class="results-header">
      <h3>
        <i class="pi pi-list"></i>
        Registros de Auditoría ({{ totalRecords }})
      </h3>
    </div>

    <div class="table-container">
      <p-table 
        [value]="auditoriasFiltered" 
        [rows]="10" 
        [paginator]="true" 
        [rowsPerPageOptions]="[5, 10, 20]" 
        [showCurrentPageReport]="true" 
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
        [totalRecords]="auditoriasFiltered.length"
        [tableStyle]="{ 'min-width': '50rem' }"
        [sortMode]="'multiple'"
        styleClass="custom-table"
        [loading]="isLoading"
        #dt>
        
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="fechaHora" class="fecha-column">
              <div class="header-content">
                <i class="pi pi-calendar"></i>
                Fecha/Hora
                <p-sortIcon field="fechaHora"></p-sortIcon>
              </div>
            </th>
            <th pSortableColumn="usuario">
              <div class="header-content">
                <i class="pi pi-user"></i>
                Usuario
                <p-sortIcon field="usuario"></p-sortIcon>
              </div>
            </th>
            <th pSortableColumn="accion">
              <div class="header-content">
                <i class="pi pi-cog"></i>
                Acción
                <p-sortIcon field="accion"></p-sortIcon>
              </div>
            </th>
            <th pSortableColumn="descripcion">
              <div class="header-content">
                <i class="pi pi-file-text"></i>
                Descripción
                <p-sortIcon field="descripcion"></p-sortIcon>
              </div>
            </th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-auditoria>
          <tr class="table-row">
            <td class="fecha-cell">{{ auditoria.fechaHoraString }}</td>
            <td class="usuario-cell">
              <div class="usuario-content">
                <i class="pi pi-user usuario-icon"></i>
                <span class="usuario-text">{{ auditoria.usuario }}</span>
              </div>
            </td>
            <td class="accion-cell">
              <p-tag 
                [value]="auditoria.accion" 
                [severity]="getAccionSeverity(auditoria.accion)"
                class="accion-tag">
              </p-tag>
            </td>
            <td class="descripcion-cell">{{ auditoria.descripcion }}</td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4">
              <div class="no-results">
                <i class="pi pi-search" style="font-size: 3rem; color: #ccc;"></i>
                <h3>No se encontraron registros de auditoría</h3>
                <p>Intenta ajustar los filtros de búsqueda para obtener resultados.</p>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>

<!-- Toast para mensajes -->
<p-toast position="top-right"></p-toast>
