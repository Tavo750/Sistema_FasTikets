<p-toast></p-toast>

<div class="editar-cliente-page">
  <div class="content-card">
    <div class="card-header">
      <h2 class="card-title">Editar información de cliente</h2>
      <button 
        class="btn-close" 
        (click)="volver()"
        type="button"
        [disabled]="loading">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <div class="card-body">
      <form [formGroup]="editarForm" (ngSubmit)="onSubmit()">
        
        <!-- Nombres -->
        <div class="form-field">
          <label for="nombres">
            Nombres <span class="required">*</span>
          </label>
          <input 
            pInputText 
            id="nombres" 
            formControlName="nombres"
            placeholder="Ejemplo: Pedro Carlos" />
          <small 
            class="p-error" 
            *ngIf="editarForm.get('nombres')?.invalid && editarForm.get('nombres')?.touched">
            Campo requerido (mínimo 2 caracteres)
          </small>
        </div>

        <!-- DNI y Edad en fila -->
        <div class="form-row-two">
          <div class="form-field">
            <label for="docIdentidad">
              DNI <span class="required">*</span>
            </label>
            <input 
              pInputText 
              id="docIdentidad" 
              formControlName="docIdentidad"
              placeholder="Ejemplo: 21"
              maxlength="8" />
            <small 
              class="p-error" 
              *ngIf="editarForm.get('docIdentidad')?.invalid && editarForm.get('docIdentidad')?.touched">
              DNI debe tener 8 dígitos
            </small>
          </div>

          <div class="form-field">
            <label for="edad">
              Edad <span class="required">*</span>
            </label>
            <input 
              pInputText 
              id="edad" 
              type="number"
              formControlName="edad"
              placeholder="Ejemplo: 21"
              min="18"
              max="100" />
            <small 
              class="p-error" 
              *ngIf="editarForm.get('edad')?.invalid && editarForm.get('edad')?.touched">
              Edad entre 18 y 100 años
            </small>
          </div>
        </div>

        <!-- Apellidos -->
        <div class="form-field">
          <label for="apellidos">
            Apellidos <span class="required">*</span>
          </label>
          <input 
            pInputText 
            id="apellidos" 
            formControlName="apellidos"
            placeholder="Ejemplo: Rodriguez Pérez" />
          <small 
            class="p-error" 
            *ngIf="editarForm.get('apellidos')?.invalid && editarForm.get('apellidos')?.touched">
            Campo requerido (mínimo 2 caracteres)
          </small>
        </div>

        <!-- Correo Electrónico -->
        <div class="form-field">
          <label for="email">
            Correo Electrónico <span class="required">*</span>
          </label>
          <input 
            pInputText 
            id="email" 
            type="email"
            formControlName="email"
            placeholder="Ejemplo: pedro@example.com" />
          <small 
            class="p-error" 
            *ngIf="editarForm.get('email')?.invalid && editarForm.get('email')?.touched">
            Ingrese un correo válido
          </small>
        </div>

        <!-- Teléfono, Departamento, Distrito en fila -->
        <div class="form-row-three">
          <div class="form-field">
            <label for="telefono">
              Número de Teléfono <span class="required">*</span>
            </label>
            <input 
              pInputText 
              id="telefono" 
              formControlName="telefono"
              placeholder="+51983953765"
              maxlength="9" />
            <small 
              class="p-error" 
              *ngIf="editarForm.get('telefono')?.invalid && editarForm.get('telefono')?.touched">
              Debe tener 9 dígitos
            </small>
          </div>

          <div class="form-field">
            <label for="departamento">Departamento</label>
            <p-select 
              [options]="departamentos" 
              formControlName="departamento"
              placeholder="Selecciona"
              [style]="{'width': '100%'}">
            </p-select>
          </div>

          <div class="form-field">
            <label for="distrito">Distrito</label>
            <p-select 
              [options]="distritos" 
              formControlName="distrito"
              placeholder="Selecciona"
              [style]="{'width': '100%'}">
            </p-select>
          </div>
        </div>

        <!-- Dirección domiciliaria -->
        <div class="form-field">
          <label for="direccion">
            Dirección domiciliaria <span class="required">*</span>
          </label>
          <input 
            pInputText 
            id="direccion" 
            formControlName="direccion"
            placeholder="Dirección domiciliaria" />
          <small 
            class="p-error" 
            *ngIf="editarForm.get('direccion')?.invalid && editarForm.get('direccion')?.touched">
            Campo requerido
          </small>
        </div>

        <!-- Botones -->
        <div class="form-actions">
          <p-button 
            label="Cancelar" 
            severity="danger"
            type="button"
            (onClick)="cancelar()"
            [disabled]="loading"
            styleClass="btn-cancelar">
          </p-button>
          
          <p-button 
            label="Guardar" 
            severity="success"
            type="submit"
            [loading]="loading"
            [disabled]="editarForm.invalid"
            styleClass="btn-guardar">
          </p-button>
        </div>
      </form>
    </div>
  </div>
</div>
