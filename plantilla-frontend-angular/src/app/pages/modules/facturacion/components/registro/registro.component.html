<p-panel header="Facturas" [toggleable]="false" styleClass="factura-panel">

  <!-- 🧾 Cabecera de la orden de compra -->
  <div class="form-grid">
    <div class="field">
      <label>Número OC</label>
      <input pInputText [(ngModel)]="registro.numeroOC" />
    </div>

    <div class="field">
      <label>Proveedor</label>
      <input pInputText [(ngModel)]="registro.proveedor" />
    </div>

    <div class="field">
      <label>Número Proveedor</label>
      <input pInputText [(ngModel)]="registro.numeroProveedor" />
    </div>

    <div class="field">
      <label for="divisa">Divisa</label>
      <p-dropdown
        inputId="divisa"
        [options]="divisas"
        [(ngModel)]="registro.divisa"
        placeholder="Seleccione una divisa"
        [style]="{ width: '100%' }"
      ></p-dropdown>
    </div>

    <div class="field">
      <label>Total de OC</label>
      <input pInputText [(ngModel)]="registro.totalOC" />
    </div>

    <div class="field">
      <label>Total Asociado</label>
      <input pInputText [(ngModel)]="registro.totalAsociado" />
    </div>
  </div>

  <!-- ➕ Formulario para agregar una nueva factura -->
  <h4>Agregar Factura</h4>
  <div class="form-grid aligned-item-center">
    <div class="field">
      <label>Factura</label>
      <input pInputText [(ngModel)]="nuevaFactura.numero" />
    </div>

    <div class="field">
      <label>Fecha</label>
      <p-calendar
        [(ngModel)]="nuevaFactura.fecha"
        dateFormat="dd/mm/yy"
        showIcon="true"
        inputId="fecha"
        placeholder="dd-mm-yyyy"
      ></p-calendar>
    </div>

    <div class="field">
      <label>Facturado</label>
      <input pInputText [(ngModel)]="nuevaFactura.facturado" />
    </div>

    <div class="field">
      <label>Pendiente</label>
      <input pInputText [(ngModel)]="nuevaFactura.pendiente" />
    </div>

    <div class="field">
      <label>Asociado</label>
      <input pInputText [(ngModel)]="nuevaFactura.asociado" />
    </div>
  </div>

  <button
    pButton
    type="button"
    label="Agregar"
    icon="pi pi-plus"
    (click)="agregarFactura()"
    style="margin-top: 10px;"
  ></button>

  <!-- 📋 Tabla de facturas -->
  <p-table [value]="registro.facturas" responsiveLayout="scroll" class="factura-table" [style]="{ 'margin-top': '1rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Factura</th>
        <th>Fecha</th>
        <th>Facturado</th>
        <th>Pendiente</th>
        <th>Asociado</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-factura>
      <tr>
        <td>{{ factura.numero }}</td>
        <td>{{ factura.fecha | date: 'dd/MM/yyyy' }}</td>
        <td>{{ factura.facturado }}</td>
        <td>{{ factura.pendiente }}</td>
        <td>{{ factura.asociado }}</td>
      </tr>
    </ng-template>
  </p-table>

  <!-- 📦 Campos adicionales de orden -->
  <div class="form-grid mt-3">
    <div class="field">
      <label>Nom Lote</label>
      <input pInputText [(ngModel)]="registro.nomLote" />
    </div>

    <div class="field">
      <label>Fecha Último Pago</label>
      <input pInputText [(ngModel)]="registro.fechaUltimoPago" />
    </div>

    <div class="field">
      <label>Retenido</label>
      <input pInputText [(ngModel)]="registro.retenido" />
    </div>

    <div class="field">
      <label>Número Cheque</label>
      <input pInputText [(ngModel)]="registro.numeroCheque" />
    </div>

    <div class="field">
      <label>Despachar</label>
      <input pInputText [(ngModel)]="registro.despachar" />
    </div>

    <div class="field">
      <label>Línea OC</label>
      <input pInputText [(ngModel)]="registro.lineaOC" />
    </div>

    <div class="field">
      <label>Envío de OC</label>
      <input pInputText [(ngModel)]="registro.envioOC" />
    </div>
  </div>

</p-panel>
